[project]
name = "sagectl"
version = "0.1.0"
description = "Deterministic tooling for sage — the one brain for every project."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
sagectl = "sagectl.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["sagectl"]

[tool.ruff]
line-length = 120
extend-exclude = ["evals"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E702", "E731", "E741"]

[tool.pytest.ini_options]
testpaths = ["tests"]
